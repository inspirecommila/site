# Site estático. O Next gera a pasta out; o runtime de servidor fica desligado
# para o Netlify publicar o HTML em vez da pasta .next.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Com domínio próprio, defina NEXT_PUBLIC_SITE_URL no painel do Netlify
# (por exemplo https://camilameneses.com.br). Sem essa variável, o site usa
# a URL principal que o Netlify injeta no build.
